<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="styles" href="style.css">
    <style>    
    input[type=text], input[type=tel],input[type=email],input[type=password], div,label[for=fname],select {
  display: block;
}
    </style>
</head>
<body>
    <p>Title</p>
    <form action="">
        <label for="title">Mr</label>
        <input type="radio" name="title" id="title">

        <label for="title2">Mrs</label>
        <input type="radio" name="title2" id="title">

        <label for="title3">Miss</label>
        <input type="radio" name="title3" id="title">

        <label for="fname">First Name</label>
        <input type="text" name="fname" id="fname">

        <label for="lname">Last Name</label>
        <input type="text" name="lname" id="lname">

        <label for="email">Email</label>
        <input type="email" name="email" id="email">

        <label for="phone">Phone number</label>
        <input type="tel" name="telnumb" id="phone">

        <label for="pass">Password</label>
        <input type="password" name="pass" id="pass">

        <label for="country">Country</label>
        <select id="country">
            <option value="China">China</option>
            <option value="Germany">Germany</option>
            <option value="Australia">Australia</option>
        </select>

        <input type="checkbox" name="terms" value="accept" required> I agree to the <a href="">terms and conditions</a>
        <div>

            <button>Sign in</button><button type="reset">Reset form</button>
        </div>
    </form>
</body>
</html>
