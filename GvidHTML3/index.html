<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{
            border: 1px solid grey;
            border-collapse:collapse;
            
        }
        th{
            text-align: left;
        }
        td{
            text-align: left;
            vertical-align:text-top;
        }
    </style>
</head>
<body>
    <h1>Mokinių tvarkaraščio pavyzdys</h1>
    <table style="margin: 100px auto;">
        <tr>
            <th>Diena</th>
            <th>Dalykas</th>
            <th>Klasė</th>
            <th>Pastaba</th>
        </tr>
        <tr>
            <td rowspan="2" style="background-color: aqua;">Pirmadienis</td>
            <td style="background-color: lightgreen;">Matematika</td>
            <td rowspan="2" style="background-color: pink;">5A</td>
            <td style="background-color:bisque;">Kontrolinis</td>
        </tr>
        <tr>
            <td style="background-color: orange;">Lietuvių kalba</td>
            <td style="background-color: lightgrey;">Namų darbai</td>
            

            
        </tr>
        <tr>
            <td style="background-color: red;">Antradienis</td>
            <td colspan="2" style="background-color: cadetblue;">Kūno kultūra (jungtinė pamoka)</td>
            <td style="background-color: pink;">Sporto salė</td>
        </tr>
    </table>
</body>
</html>
